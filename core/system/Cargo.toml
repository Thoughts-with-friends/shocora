wiiu_peripherals = { workspace = true }
wiiu_sound = { workspace = true }
wiiu_rpl = { workspace = true }
wiiu_title = { workspace = true }

[dev-dependencies]
wiiu_rpl = { workspace = true, features = ["builder"] }

