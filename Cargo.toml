[workspace.package]
version = "0.1.0"
authors = ["DiaSird"]
categories = ["emulators"]
edition = "2024"
keywords = ["emulator", "wiiu", "rust"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/DiaSird/shocora"
rust-version = "1.95"

[workspace]
default-members = ["gui/egui"]
members = [
  "core/*",
  "gui/*",
  "tests",
  "xtask",
]
resolver = "3"

[profile.release]
# debug = true
lto = "thin"

# The emulator cannot keep real time without optimisation. "*" alone would not cover
# the workspace's own crates, where nearly all the time goes.
[profile.dev]
opt-level = 3

[workspace.dependencies]
bitflags = "2.13"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

# core crates (split per Wii U hardware block / system software layer)
wiiu_cafe_os = { path = "./core/cafe_os" }
wiiu_cpu = { path = "./core/cpu" }
wiiu_emu = { path = "./core/system" }
wiiu_fs = { path = "./core/fs" }
wiiu_gpu = { path = "./core/gpu" }
wiiu_hle_macros = { path = "./core/hle_macros" }
wiiu_interrupt = { path = "./core/interrupt" }
wiiu_iosu = { path = "./core/iosu" }
wiiu_mem_addr = { path = "./core/mem_addr" }
wiiu_memory = { path = "./core/memory" }
wiiu_peripherals = { path = "./core/peripherals" }
wiiu_rpl = { path = "./core/rpl" }
wiiu_sound = { path = "./core/sound" }
wiiu_test_roms = { path = "./core/test_roms" }
wiiu_title = { path = "./core/title" }

# front end crates
shocora_game_library = { path = "./gui/game_library" }
shocora_gui_common = { path = "./gui/common" }
shocora_netplay = { path = "./gui/netplay" }
shocora_render = { path = "./gui/render" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# allow list
collapsible_if = "allow"

derive_partial_eq_without_eq = "allow"
future_not_send = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"

# custom deny list
char_lit_as_u8 = "deny"
checked_conversions = "deny"
clone_on_ref_ptr = "deny"
debug_assert_with_mut_call = "deny"
disallowed_script_idents = "deny"
doc_link_with_quotes = "deny"
empty_enums = "deny"
empty_line_after_outer_attr = "deny"
empty_structs_with_brackets = "deny"
expect_used = "deny"
expl_impl_clone_on_copy = "deny"
explicit_deref_methods = "deny"
explicit_into_iter_loop = "deny"
fallible_impl_from = "deny"
filetype_is_file = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
float_cmp_const = "deny"
float_equality_without_abs = "deny"
fn_params_excessive_bools = "deny"
fn_to_numeric_cast_any = "deny"
if_let_mutex = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
invalid_upcast_comparisons = "deny"
items_after_test_module = "deny"
large_digit_groups = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
let_unit_value = "deny"
linkedlist = "deny"
lossy_float_literal = "deny"
macro_use_imports = "deny"
manual_ok_or = "deny"
map_flatten = "deny"
map_unwrap_or = "deny"
match_wild_err_arm = "deny"
mem_forget = "deny"
missing_enforced_import_renames = "deny"
mut_mut = "deny"
mutex_integer = "deny"
needless_borrow = "deny"
needless_continue = "deny"
needless_for_each = "deny"
option_option = "deny"
path_buf_push_overwrite = "deny"
ptr_as_ptr = "deny"
rc_mutex = "deny"
ref_option_ref = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_functions_in_if_condition = "deny"
semicolon_if_nothing_returned = "deny"
string_add = "deny"
string_add_assign = "deny"
string_lit_as_bytes = "deny"
suspicious_operation_groupings = "deny"
trait_duplication_in_bounds = "deny"
unnested_or_patterns = "deny"
unseparated_literal_suffix = "deny"
unused_self = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
useless_let_if_seq = "deny"
useless_transmute = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
