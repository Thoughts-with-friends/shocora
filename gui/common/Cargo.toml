[package]
name = "shocora_gui_common"
description = "Front-end helpers shared by every shocora GUI: console thread, config, input mapping, loader"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
cpal = "0.17"
shocora_render = { workspace = true }
gilrs = "0.11"
log = { workspace = true }
serde = { workspace = true }
toml = "0.9"
wiiu_emu = { workspace = true }
wiiu_peripherals = { workspace = true }
wiiu_title = { workspace = true }

# Controller motion sensors are read straight from the HID reports; on Windows without C code.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6"

[lints]
workspace = true
