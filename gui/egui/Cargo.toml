[package]
name = "shocora"
description = "shocora: the default egui front end"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wayland", "wgpu", "x11"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "webp"] }
shocora_game_library = { workspace = true }
shocora_gui_common = { workspace = true }
shocora_netplay = { workspace = true }
shocora_render = { workspace = true }
log = { workspace = true }
rfd = "0.15"
serde_json = "1"
wiiu_emu = { workspace = true }
wiiu_title = { workspace = true }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
